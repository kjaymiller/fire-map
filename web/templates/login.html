{% extends 'base.html' %}

{% block content %}
<div id="login-section">
    <h2>Log in</h2>
    <p>
        Sign in to <a href="/notify">set up alerts</a> or
        <a href="/manage">manage your subscriptions</a>.
    </p>

    <form id="login-form">
        <fieldset>
            <label for="login-username">Username</label>
            <input type="text" id="login-username" name="username" required>

            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" required>

            <input type="submit" value="Log in">
        </fieldset>
    </form>
    <p id="login-status"></p>
    <p><small>Don't have an account? <a href="/register">Create one</a>.</small></p>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', function (event) {
        event.preventDefault();

        var form = event.target;
        var status = document.getElementById('login-status');
        var payload = { username: form.username.value, password: form.password.value };

        status.textContent = 'Signing in…';

        fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify(payload)
        })
            .then(function (response) {
                if (!response.ok) {
                    return response.json().then(function (body) {
                        throw new Error(body.detail || ('Request failed: ' + response.status));
                    });
                }
                return response.json();
            })
            .then(function () {
                window.location.href = '/notify';
            })
            .catch(function (err) {
                status.textContent = 'Could not sign in: ' + err.message;
            });
    });
</script>
{% endblock %}
